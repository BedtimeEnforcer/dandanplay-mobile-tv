## 构建内存配置（轻享版调优）
## 本机 15G 内存 / 12 核，且系统常驻占用较高（可用约 4G），默认配置会 OOM 崩溃
## （hs_err_pid*.log 记录 "Native memory allocation (malloc) failed"）。
## 优化手段：
##   1. -XX:ActiveProcessorCount=2      让 JVM 按 2 核开线程，native 内存与线程栈大幅下降
##   2. kotlin.compiler.execution.strategy=in-process   Kotlin 编译在 Gradle 进程内完成，不再另开 daemon
##   3. -XX:+UseSerialGC                单线程 GC，省掉并行 GC 线程
##   4. org.gradle.workers.max=1        串行执行任务，避免多进程叠加
##   5. -Xss512k                        降低线程栈，减少 native 占用
kotlin.code.style=official
org.gradle.jvmargs=-Xmx1536m -XX:ActiveProcessorCount=2 -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=96m -XX:+UseSerialGC -Xss512k -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=true
android.overridePathCheck=true
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=15000
systemProp.org.gradle.internal.repository.max.retries=2
systemProp.org.gradle.internal.repository.initial.backoff=500
